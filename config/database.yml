default: &default
  adapter: postgresql
  encoding: unicode
  host: localhost
  port: 5432
  username: rails_local
  password: <%= ENV["DB_PASSWORD"] %>
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>


development:
  <<: *default
  database: cris_dev

test:
  <<: *default
  database: cris_test

production:
  primary: &primary_production
    <<: *default
    database: cris_prod
    username: cris
    password: <%= ENV["CRIS_DATABASE_PASSWORD"] %>
  cache:
    <<: *primary_production
    database: cris_prod_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: cris_prod_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: cris_prod_cable
    migrations_paths: db/cable_migrate
