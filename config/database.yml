default: &default
  adapter: postgresql
  encoding: unicode
  username: <%= ENV["CRIS_DATABASE_USERNAME"] %>
  password: <%= ENV["CRIS_DATABASE_PASSWORD"] %>
  host: <%= ENV["CRIS_DATABASE_HOST"] %>
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: cris_dev
test:
  <<: *default
  database: cris_test

production:
  primary: &primary_production
    <<: *default
    database: cris_production
    username: customer_ops
    password: <%= ENV["CRIS_DATABASE_PASSWORD"] %>
  cache:
    <<: *primary_production
    database: customer_ops_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: customer_ops_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: customer_ops_production_cable
    migrations_paths: db/cable_migrate
