default: &default
  adapter: postgresql
  encoding: unicode
  username: <%= ENV["DATABASE_USERNAME"] %>
  password: <%= ENV["DATABASE_PASSWORD"] %>
  host: <%= ENV["DATABASE_HOST"] %>
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: cris_dev
test:
  <<: *default
  database: cris_test

production:
  primary: &primary_production
    <<: *default
    database: cris_prod
  cache:
    <<: *primary_production
    database: cris_prod_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: cris_prod_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: cris_prod_cable
    migrations_paths: db/cable_migrate
